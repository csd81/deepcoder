name: Daily smoke
on:
  schedule:
    - cron: "0 6 * * *"   # daily 6 AM UTC
  workflow_dispatch:       # manual trigger

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci --ignore-scripts
      - run: npm run smoke
